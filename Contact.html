        <!--Forms-->
        <div class="contact-container">
            <h2>Get in Touch</h2>
            <p>We Serves you with pleasure and care.<br>
            Have a any questions about visiting Lesotho?</p>

        <form id="contactForm">
            <label for="Firstname">Name</label>
            <input type="text" id="Firstname" placeholder="Enter your Firstname" required>

            <label for="Second name">Surname</label><br>
            <input type="text" id="Surname" placeholder="Enter your surname name" required>

            <label for="Othername">Othername (Optional)</label><br>
            <input type="text" id="Othername" placeholder="Enter Othername" required>

            <label for="PrimaryContact">Primary Contact number</label><br>
            <input type="tel" id="Contact" placeholder="Enter your phone number" required>

            <label for="SencondaryContact">Sencondary Contact number</label><br>
            <input type="tel" id=" Sencondary Contacts" placeholder="Enter your pnone number" required>

            <label for="Email Address">Email Address</label><br>
            <input type="email" id="Email Address" placeholder="Enter your Email" required>
            
            <label for="Message">Your Mesaage</label>
            <textarea id="Message" placeholder="Write your message here" rows="5" required></textarea>

            <button type="submit">Send Massage</button>
            <button type="reset">reset</button>
            <div id="formMessage" class="mt-3" aria-live="polite"></div>
            </form>
        </div>
